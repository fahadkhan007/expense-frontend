<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Teal rounded background -->
  <rect width="32" height="32" rx="8" fill="#1CC29F"/>

  <!-- Upward trend line -->
  <polyline
    points="5,24 11,15 17,19 27,7"
    fill="none"
    stroke="white"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Dot at peak -->
  <circle cx="27" cy="7" r="2.2" fill="white"/>

  <!-- Baseline -->
  <line x1="5" y1="27" x2="27" y2="27" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" stroke-linecap="round"/>
</svg>